# Fly.io configuration for quiz-pack-api — STAGING (backend only; #193 task
# 193.10). Runbook: docs/setup/staging.md.
# Deploy from repository root: `fly deploy -c apps/quiz-pack-api/fly.staging.toml`.
# The worker group is kept at 0 machines (`fly scale count worker=0`): an idle
# worker runs 24/7 (~$3/month) and its sweep would re-run copied prod orders
# on paid LLM keys. Scale it to 1 only while rehearsing pack generation.
app = "quiz-pack-api-staging"
primary_region = "cdg"

[build]
  dockerfile = "Dockerfile"
  build_context = "../.."

# Same as prod: migrate before rollout, so a migration is rehearsed here first.
[deploy]
  release_command = "alembic upgrade head"

[env]
  ENVIRONMENT = "staging"

[processes]
  web = "uvicorn app.main:app --host 0.0.0.0 --port 8003"
  worker = "arq app.worker.WorkerSettings"

[[vm]]
  processes = ["web", "worker"]
  # 256mb (#41 B4 cost hygiene) OOM-killed the arq worker and pushed web boot
  # past the health-check grace once Sentry + the boot-time migration head
  # check landed (2026-07-18 arch-review remediation). Revisit after the
  # legacy import-bloat cleanup slims module import.
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1

[[services]]
  processes = ["web"]
  protocol = "tcp"
  internal_port = 8003
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[services.ports]]
    port = 80
    handlers = ["http"]
    force_https = true

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [[services.http_checks]]
    grace_period = "30s"
    interval = "30s"
    timeout = "10s"
    method = "GET"
    path = "/health"
