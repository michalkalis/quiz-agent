name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read
  issues: read
  id-token: write
  actions: read

jobs:
  claude-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugins: "code-review@claude-code-plugins"
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          claude_args: '--model claude-opus-5 --allowedTools "mcp__github_inline_comment__create_inline_comment"'

  # #189 — TF feedback 2026-09-29: automated copy check instead of a manual review of every text.
  copy-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: changed
        run: |
          if git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -E '\.xcstrings$|VoiceCommandLexicon|SpokenPrompt'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.changed.outputs.run == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Copy review of PR ${{ github.repository }}#${{ github.event.pull_request.number }}.
            Read docs/design/copy-style.md. Run `git diff origin/${{ github.base_ref }}...HEAD` and review ONLY user-facing
            texts this PR adds or changes (sk, cs, en values in .xcstrings files, voice hints and spoken prompts in Swift).
            Ignore code, comments and unchanged texts. For each objective violation of a rule in copy-style.md, post one
            inline comment on the changed line naming the rule and giving the exact replacement for every affected
            language. Taste and tone are not findings. If there are no violations, post nothing.
          claude_args: '--model claude-opus-5 --allowedTools "mcp__github_inline_comment__create_inline_comment,Read,Grep,Glob,Bash(git diff:*)"'
