name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read
  issues: read
  id-token: write
  actions: read

jobs:
  claude-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Token economy: docs-only PRs (docs/, design/, *.md) skip the LLM review;
      # the job still succeeds so the required status check passes.
      - id: scope
        name: Check if diff needs review
        run: |
          files=$(git diff --name-only "origin/${{ github.base_ref }}"...HEAD)
          echo "$files"
          if echo "$files" | grep -qvE '^(docs/|design/)|\.md$'; then
            echo "review=true" >> "$GITHUB_OUTPUT"
          else
            echo "review=false" >> "$GITHUB_OUTPUT"
            echo "Docs-only diff — skipping Claude review."
          fi

      - if: steps.scope.outputs.review == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugins: "code-review@claude-code-plugins"
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          prompt: "/code-review:code-review medium --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          claude_args: '--model claude-sonnet-5 --allowedTools "mcp__github_inline_comment__create_inline_comment"'
