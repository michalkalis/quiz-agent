<!doctype html>
<html lang="{{gen.lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{gen.title}}</title>
<link rel="canonical" href="{{gen.canonical}}">
{{gen.alternates}}
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src 'self'; font-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#FFFFFF">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0F1014">
<link rel="preload" href="/funnel-sans-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<!-- Generated by apps/website/build.py from src/legal.html + src/legal/{{gen.page}}.{{gen.lang}}.html. Do not edit by hand. -->
<style>
{{gen.fonts}}
:root{
  color-scheme:light dark;
  --bg:#FFFFFF;--ink:#111214;--ink2:#4B4F5A;--ink3:#5A5E69;--surf:#F4F5F7;--line:rgba(17,18,20,.12);--link:#1A2FC4;
  --warn:#FFD23F;
  --ui:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",system-ui,"Segoe UI",Roboto,sans-serif;
  --font:"Funnel Sans",var(--ui);
  --display:"Calistoga","Funnel Sans",var(--ui);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0F1014;--ink:#F2F3F5;--ink2:#B9BDC7;--ink3:#9A9EA9;--surf:#1C1D23;--line:rgba(255,255,255,.1);--link:#8C9BFF;
  --warn:#EBBF35;
}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased;line-height:1.55}
a{color:var(--link)}
.wrap{max-width:1120px;margin:0 auto;padding:0 16px}
@media (min-width:720px){.wrap{padding:0 32px}}

.brand{display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--ink)}
.brand span{font-family:"Rethink Sans",var(--font);font-size:26px;font-weight:800;letter-spacing:-.03em}
header.top{display:flex;align-items:center;gap:12px;padding:18px 0}
.lang{margin-left:auto;display:flex;gap:2px;font-size:15px;font-weight:600}
.lang a{display:inline-flex;align-items:center;justify-content:center;min-width:40px;height:40px;border-radius:20px;color:var(--ink3);text-decoration:none}
.lang a[aria-current]{color:var(--ink);background:var(--surf)}

/* legal text: one readable column on a surface card */
.doc{max-width:760px;margin:24px 0 0;padding:28px 20px 32px;border-radius:28px;background:var(--surf);overflow-wrap:break-word}
@media (min-width:720px){.doc{padding:40px 44px 44px}}
.doc h1{font-family:var(--display);font-size:clamp(30px,5vw,44px);line-height:1.05;font-weight:500;letter-spacing:-.01em;margin:0;text-wrap:balance}
.doc h2{font-family:var(--display);font-size:22px;font-weight:600;letter-spacing:-.01em;margin:1.8em 0 .4em}
.doc h3{font-size:17px;font-weight:700;margin:1.4em 0 .3em}
.doc p,.doc li{color:var(--ink2);font-size:16px}
.doc p{margin:.6em 0}
.doc ul{padding-left:1.2em;margin:.6em 0}
.doc li{margin:.35em 0}
.doc strong{color:var(--ink)}
.doc .meta{color:var(--ink3);font-size:14px;margin-top:10px}
.doc .warn,.doc .card{border-radius:20px;padding:4px 18px;margin:20px 0;background:var(--bg)}
.doc .warn{border-left:5px solid var(--warn)}
.doc .warn h2{margin-top:.8em}

footer{padding:40px 0 48px;color:var(--ink3);font-size:14px}
footer .row{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;justify-content:space-between;border-top:1px solid var(--line);padding-top:24px}
footer nav{display:flex;flex-wrap:wrap;gap:16px}
footer a{color:var(--ink2)}
footer .social{margin-top:16px}
footer address{font-style:normal;margin-top:12px}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <a class="brand" href="{{gen.home}}" aria-label="Trubbo">
      <img class="mark" src="/mascot.svg" width="29" height="33" alt="">
      <span>trubbo</span>
    </a>
    <nav class="lang" aria-label="{{nav.lang}}">{{gen.switcher}}</nav>
  </header>

  <main class="doc">
{{gen.body}}
  </main>
</div>

{{gen.footer}}
</body>
</html>
