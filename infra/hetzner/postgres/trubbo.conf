# Postgres config of the Hetzner server (#222 — moving the backend to Hetzner).
# Loaded with -c config_file=...; ALTER SYSTEM (postgresql.auto.conf in the data
# directory) is read after this file and wins, so wal_watch's self-heal
# (archive_command = '/bin/true') and its RESET keep working.
include '/var/lib/postgresql/data/postgresql.conf'   # initdb defaults (listen_addresses = '*', ...)

shared_buffers = 256MB
effective_cache_size = 768MB
work_mem = 8MB
max_connections = 60

# PITR: every WAL segment to R2, closed at least every 5 min (RPO <= ~5 min).
# Base backups: nightly via infra/hetzner/backup-ssh.sh basebackup.
archive_mode = on
archive_timeout = 300
archive_command = '/usr/local/bin/wal-archive %p'
