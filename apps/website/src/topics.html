<!doctype html>
<html lang="{{gen.lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{gen.title}}</title>
<meta name="description" content="{{gen.description}}">
<link rel="canonical" href="{{gen.canonical}}">
{{gen.alternates}}
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src 'self'; font-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="apple-itunes-app" content="app-id={{gen.store.id}}">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#FFFFFF">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0F1014">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Trubbo">
<meta property="og:title" content="{{gen.title}}">
<meta property="og:description" content="{{gen.description}}">
<meta property="og:url" content="{{gen.canonical}}">
<meta property="og:image" content="https://trubbo.app/og.png">
<meta name="twitter:card" content="summary_large_image">
{{gen.jsonld}}
<link rel="preload" href="/calistoga-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/funnel-sans-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<!-- Generated by apps/website/build.py (topics.py) from src/topics.html + src/topics/. Do not edit by hand. No script: answers open via <details>. -->
<style>
{{gen.fonts}}
:root{
  color-scheme:light dark;
  --bg:#FFFFFF;--ink:#111214;--ink2:#4B4F5A;--line:rgba(17,18,20,.12);--soft:#F4F5F7;--link:#1A2FC4;
  --blue:#2C45F5;--orange:#FF6B2C;--green:#3FE0AE;--yellow:#FFD23F;--purple:#7A5CFF;--rose:#C2255F;
  --btn:#111214;--btn-ink:#FFFFFF;
  --display:"Calistoga","Funnel Sans",-apple-system,system-ui,sans-serif;
  --font:"Funnel Sans",-apple-system,BlinkMacSystemFont,system-ui,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0F1014;--ink:#F2F3F5;--ink2:#B9BDC7;--line:rgba(255,255,255,.12);--soft:#1C1D23;--link:#8C9BFF;
  --blue:#3A52FF;--orange:#F0662C;--green:#2FC99B;--yellow:#EBBF35;--purple:#7052F5;--rose:#E0447F;
  --btn:#F2F3F5;--btn-ink:#111214;
}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;overflow-x:clip;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:18px;line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:var(--link)}
h1,h2,p{margin:0}
a:focus-visible,summary:focus-visible{outline:3px solid var(--link);outline-offset:3px}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}
@media (min-width:720px){.wrap{padding:0 32px}}
.disp{font-family:var(--display);font-weight:500;letter-spacing:-.01em}
.brand{display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--ink);font-family:"Rethink Sans",var(--font);font-size:26px;font-weight:800;letter-spacing:-.03em}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 18px;border-radius:22px;background:var(--btn);color:var(--btn-ink);font-size:15px;font-weight:600;text-decoration:none}
header.top{display:flex;align-items:center;gap:12px;padding:20px 0}
.lang{margin-left:auto;display:flex;gap:2px;font-size:15px;font-weight:600}
.lang a{display:inline-flex;align-items:center;justify-content:center;min-width:40px;height:40px;border-radius:20px;color:var(--ink2);text-decoration:none}
.lang a[aria-current]{color:var(--ink);background:var(--soft)}
@media (max-width:459px){header.top .btn{display:none}}

/* category colour per topic: the number badges and the hub cards */
.c-blue{--c:var(--blue);--c-ink:#fff}.c-orange{--c:var(--orange);--c-ink:#111214}.c-green{--c:var(--green);--c-ink:#111214}
.c-purple{--c:var(--purple);--c-ink:#fff}.c-yellow{--c:var(--yellow);--c-ink:#111214}.c-rose{--c:var(--rose);--c-ink:#fff}

.crumb{font-size:15px;padding-top:8px}
.crumb a{color:var(--ink2)}
.head{padding:16px 0 28px;max-width:760px}
.head h1{font-size:clamp(36px,6vw,64px);line-height:1.02;text-wrap:balance}
.head .lead{margin-top:16px;font-size:20px;color:var(--ink2)}
.head .how{margin-top:10px;font-size:16px;color:var(--ink2)}

/* questions: one card each, numbered in the topic colour; the answer opens in place */
.qs{list-style:none;margin:0;padding:0;display:grid;gap:14px;max-width:760px;counter-reset:q}
.qa{counter-increment:q;position:relative;background:var(--soft);border-radius:24px;padding:20px 20px 18px 72px}
.qa::before{content:counter(q);position:absolute;left:18px;top:18px;width:38px;height:38px;border-radius:19px;background:var(--c);color:var(--c-ink);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:600;font-size:17px}
.q{font-family:var(--display);font-size:21px;line-height:1.3;font-weight:500;text-wrap:pretty}
details{margin-top:12px}
summary{display:inline-flex;align-items:center;min-height:40px;padding:0 16px;border-radius:20px;border:1.5px solid var(--line);font-size:15px;font-weight:600;cursor:pointer;list-style:none;color:var(--ink)}
summary::-webkit-details-marker{display:none}
details[open] summary{display:none}
.a{font-family:var(--display);font-size:22px;font-weight:600}
.story{margin-top:6px;color:var(--ink2);font-size:16px}
.src{display:inline-block;margin-top:8px;font-size:14px;color:var(--ink2)}
@media (max-width:519px){.qa{padding:18px 16px 16px 60px}.qa::before{left:12px;width:34px;height:34px;font-size:15px}.q{font-size:19px}}

.cta{margin:40px 0 0;max-width:760px;border-radius:28px;background:var(--blue);color:#fff;padding:28px 24px;display:grid;gap:20px}
.cta h2{font-size:clamp(26px,4vw,36px);line-height:1.1}
.cta p{margin-top:8px;color:rgba(255,255,255,.88);font-size:17px}
.ctas{display:flex;flex-wrap:wrap;align-items:center;gap:12px 16px}
.store{display:inline-flex;line-height:0;border-radius:10px}
.store img{display:block;height:52px;width:auto}
.note{font-size:15px;color:rgba(255,255,255,.88)}
@media (min-width:720px){.cta{grid-template-columns:1fr auto;align-items:center;padding:36px 40px}}

.more{margin-top:56px}
.more h2{font-size:clamp(26px,4vw,36px);margin-bottom:18px}
.topics{list-style:none;margin:0;padding:0;display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.topic{display:flex;flex-direction:column;gap:6px;height:100%;padding:22px 22px 24px;border-radius:24px;background:var(--c);color:var(--c-ink);text-decoration:none}
.topic .t{font-family:var(--display);font-size:22px;line-height:1.15;font-weight:600}
.topic .n{font-size:14px;font-weight:600;opacity:.8}
.topic .ex{margin-top:6px;font-size:15px;line-height:1.4;opacity:.9;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
main > .topics{margin-bottom:8px}
.topic.fresh{background:var(--ink);color:var(--bg)}
.topic.fresh .n{align-self:flex-start;opacity:1;background:var(--rose);color:#fff;border-radius:12px;padding:2px 10px}

footer{padding:48px 0 48px;color:var(--ink2);font-size:14px}
footer .row{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;justify-content:space-between;border-top:1px solid var(--line);padding-top:24px}
footer nav{display:flex;flex-wrap:wrap;gap:16px}
footer a{color:var(--ink2)}
footer .social{margin-top:16px}
footer address{font-style:normal;margin-top:12px}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <a class="brand" href="{{gen.home}}" aria-label="Trubbo"><img src="/mascot.svg" width="29" height="33" alt=""><span>trubbo</span></a>
    <nav class="lang" aria-label="{{nav.lang}}">{{gen.switcher}}</nav>
    <a class="btn" href="{{gen.store}}">{{gen.cta}}</a>
  </header>
  <main>
{{gen.main}}
  </main>
</div>

{{gen.footer}}
</body>
</html>
