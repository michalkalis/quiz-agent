name: website

# Builds apps/website and deploys apps/website/public to GitHub Pages (trubbo.app).
# One-time setup: repo Settings → Pages → Source "GitHub Actions" (see apps/website/README.md).
on:
  push:
    branches: [main]
    paths:
      - "apps/website/**"
      - ".github/workflows/website.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate site
        run: python3 apps/website/build.py
      - name: Committed output matches the sources
        run: git diff --exit-code -- apps/website/public
      - uses: actions/upload-pages-artifact@v5
        with:
          path: apps/website/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
