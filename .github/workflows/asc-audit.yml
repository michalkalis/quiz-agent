name: asc-audit

on:
  workflow_dispatch:
    inputs:
      script:
        description: "asc_audit (products/prices) or asc_readiness_audit (TestFlight + listing)"
        default: asc_audit
        type: choice
        options: [asc_audit, asc_readiness_audit]

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyjwt cryptography requests
      - name: Read-only App Store Connect audit
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          ASC_API_KEY_CONTENT: ${{ secrets.ASC_API_KEY_CONTENT }}
        run: python scripts/${{ inputs.script }}.py
