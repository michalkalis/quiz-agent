<title>Otrepané otázky</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rethink+Sans:wght@400;500;700&display=swap">
<style>
/* Layout: one narrow column of question cards, sticky progress bar on top; tap-first controls for phone use. */
:root {
  --bg: #f3f4f1;
  --card: #ffffff;
  --fg: #1b1d1a;
  --muted: #646a62;
  --line: #dde0d9;
  --accent: #1f5f4a;
  --accent-ink: #ffffff;
  --accent-soft: #dcebe4;
  --no: #8a3b2a;
  --no-soft: #f3e1dc;
  --font: "Rethink Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121411; --card: #1b1e1a; --fg: #e7eae4; --muted: #9aa196; --line: #2c312a;
    --accent: #6fc3a2; --accent-ink: #0f1a15; --accent-soft: #1f3a30; --no: #e49a86; --no-soft: #3a2420;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121411; --card: #1b1e1a; --fg: #e7eae4; --muted: #9aa196; --line: #2c312a;
  --accent: #6fc3a2; --accent-ink: #0f1a15; --accent-soft: #1f3a30; --no: #e49a86; --no-soft: #3a2420;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 16px; line-height: 1.45; }
.wrap { max-width: 44rem; margin: 0 auto; padding-inline: 16px; padding-block: 0 4rem; }
header.bar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 2; background: var(--bg);
  padding-block: 0.75rem; border-bottom: 1px solid var(--line); display: flex; gap: 1rem; align-items: center; flex-wrap: wrap;
}
header.bar h1 { font-size: 1.15rem; margin: 0; font-weight: 700; flex: 1 1 auto; text-wrap: balance; }
.progress { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 0.9rem; }
.status { font-size: 0.85rem; color: var(--muted); width: 100%; }
.status.bad { color: var(--no); }
.intro { color: var(--muted); max-width: 62ch; margin-block: 1rem 1.5rem; }
.list { display: grid; gap: 1rem; }
.q { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 1rem; display: grid; gap: 0.75rem; min-width: 0; }
.q.done { border-color: var(--accent); }
.meta { display: flex; gap: 0.5rem; align-items: center; font-size: 0.8rem; color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }
.meta .lang { border: 1px solid var(--line); border-radius: 999px; padding: 0 0.5rem; }
.stem { font-size: 1.05rem; font-weight: 500; margin: 0; }
.opts { margin: 0; padding-left: 1.2rem; color: var(--fg); }
details summary { cursor: pointer; color: var(--accent); font-weight: 500; }
details p { margin: 0.4rem 0 0; }
.ans { font-weight: 700; }
.row { display: grid; gap: 0.4rem; }
.row label, .row .lbl { font-size: 0.85rem; color: var(--muted); }
.scale { display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 0.3rem; }
.scale button, .yn button {
  font: inherit; font-variant-numeric: tabular-nums; border: 1px solid var(--line); background: var(--bg); color: var(--fg);
  border-radius: 8px; padding-block: 0.55rem; cursor: pointer; min-width: 0;
}
.scale button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.yn { display: grid; grid-template-columns: 1fr 1fr; gap: 0.4rem; }
.yn button[data-v="keep"][aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--fg); }
.yn button[data-v="drop"][aria-pressed="true"] { background: var(--no-soft); border-color: var(--no); color: var(--fg); }
button:focus-visible, textarea:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
textarea { font: inherit; width: 100%; min-height: 2.6rem; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--fg); padding: 0.5rem; resize: vertical; }
</style>

<div class="wrap">
  <header class="bar">
    <h1>Otrepané otázky</h1>
    <span class="progress" id="progress">0 / 0</span>
    <span class="status" id="status">Pripájam úložisko…</span>
  </header>
  <p class="intro">30 otázok zo zásoby, zamiešané a bez označenia, ako ich kontrola posúdila. Pri každej rozhodni: je otrepaná alebo nudná ako Rosa Parks (vyhodiť), alebo ju nechať? Ukladá sa hneď po ťuknutí.</p>
  <div class="list" id="list"></div>
</div>

<script>
const ITEMS = [{"id": "Q1", "lang": "en", "question": "Africa's highest mountain rises in which country?", "answer": "Tanzania", "options": [], "explanation": ""}, {"id": "Q2", "lang": "cs", "question": "Odkud se vzalo prostřední jméno prvního československého prezidenta, Garrigue?", "answer": "od manželky Charlotty", "options": [], "explanation": ""}, {"id": "Q3", "lang": "en", "question": "The famous 12th-century chess pieces carved mostly from walrus ivory, with wide-eyed kings and shield-biting warriors, were discovered in 1831 on an island belonging to which country?", "answer": "Scotland", "options": [], "explanation": ""}, {"id": "Q4", "lang": "en", "question": "In a classic 1999 experiment, people asked to count basketball passes mostly failed to notice someone in a full animal costume stroll into the middle of the game, stop, and face the camera. Which animal?", "answer": "A gorilla", "options": [], "explanation": ""}, {"id": "Q5", "lang": "en", "question": "In which country would you find the world's largest living lizard roaming in the wild?", "answer": "Indonesia", "options": [], "explanation": ""}, {"id": "Q6", "lang": "en", "question": "Which 14th-century scholar from Tangier spent nearly thirty years travelling around 120,000 kilometres across Africa, the Middle East, India and China, out-distancing Marco Polo?", "answer": "Ibn Battuta", "options": [], "explanation": ""}, {"id": "Q7", "lang": "en", "question": "Until 2018, every long-distance train timetable across Russia, even in Vladivostok seven hours ahead, showed times according to the clock of which single city?", "answer": "Moscow", "options": [], "explanation": ""}, {"id": "Q8", "lang": "en", "question": "In 1618 two imperial governors were thrown out of a window of Prague Castle. The incident is regarded as the start of which European war?", "answer": "Thirty Years' War", "options": [], "explanation": ""}, {"id": "Q9", "lang": "en", "question": "The chalky limescale that builds up inside kettles is mostly a carbonate of which element?", "answer": "Calcium", "options": [], "explanation": ""}, {"id": "Q10", "lang": "en", "question": "Three of these famous ballets have music by Tchaikovsky. Which one does not?", "answer": "Giselle", "options": ["Swan Lake", "Giselle", "The Sleeping Beauty", "The Nutcracker"], "explanation": ""}, {"id": "Q11", "lang": "en", "question": "Titanic had two sister ships; one sank as a hospital ship in the First World War. Name the other, which sailed safely for over two decades.", "answer": "Olympic", "options": [], "explanation": ""}, {"id": "Q12", "lang": "en", "question": "The red colouring carmine, listed on European labels as E120 and found in sweets, yoghurts and lipstick, is made by crushing what?", "answer": "Insects", "options": [], "explanation": ""}, {"id": "Q13", "lang": "en", "question": "Caesar's boast 'I came, I saw, I conquered' followed a lightning victory in 47 BC. In which modern country was that battle fought?", "answer": "Turkey", "options": [], "explanation": ""}, {"id": "Q14", "lang": "en", "question": "Ethiopia's official calendar is unusual: how many months does it have?", "answer": "Thirteen", "options": [], "explanation": ""}, {"id": "Q15", "lang": "en", "question": "Albert Einstein received his only Nobel Prize in 1921, and the citation deliberately did not mention relativity. Which effect, involving light knocking electrons out of metal, was he honoured for explaining?", "answer": "The photoelectric effect", "options": [], "explanation": ""}, {"id": "Q16", "lang": "en", "question": "In 1917 the British royal family dropped its German-sounding name and adopted a new surname taken from a castle. Which castle?", "answer": "Windsor Castle", "options": [], "explanation": ""}, {"id": "Q17", "lang": "en", "question": "The cruise ship Costa Concordia capsized in 2012 after striking rocks just off a small island belonging to which country?", "answer": "Italy", "options": [], "explanation": ""}, {"id": "Q18", "lang": "en", "question": "Which African country has three capital cities, each hosting a different branch of its government?", "answer": "South Africa", "options": [], "explanation": ""}, {"id": "Q19", "lang": "en", "question": "Which planet is hotter at the surface: Mercury, closest to the Sun, or Venus?", "answer": "b", "options": ["Mercury", "Venus"], "explanation": ""}, {"id": "Q20", "lang": "cs", "question": "Který český psychiatr v roce 1907 rozdělil lidskou krev do čtyř krevních skupin?", "answer": "Jan Janský", "options": [], "explanation": ""}, {"id": "Q21", "lang": "en", "question": "Whose refusal to give up her seat on a city bus in Alabama in 1955 set off a boycott that lasted more than a year?", "answer": "Rosa Parks", "options": [], "explanation": ""}, {"id": "Q22", "lang": "en", "question": "A furry, guinea-pig-sized animal that suns itself on African rocks is one of the elephant's closest living relatives. What is it?", "answer": "Hyrax", "options": [], "explanation": ""}, {"id": "Q23", "lang": "en", "question": "Long before it meant a handheld gadget, the word 'camera' was Latin for what kind of place that early artists actually stood inside?", "answer": "A dark room", "options": [], "explanation": ""}, {"id": "Q24", "lang": "en", "question": "How many years did Nelson Mandela spend in prison before his release in 1990?", "answer": "27 years", "options": [], "explanation": ""}, {"id": "Q25", "lang": "en", "question": "Mount Fuji is still classed as an active volcano. In which year did it last erupt?", "answer": "1707", "options": ["1707", "1783", "1888", "1914"], "explanation": ""}, {"id": "Q26", "lang": "en", "question": "On which Pacific islands was the British navigator James Cook killed in 1779, during his third great voyage?", "answer": "Hawaii", "options": [], "explanation": ""}, {"id": "Q27", "lang": "en", "question": "Niagara gets the fame, but the world's tallest waterfall plunges almost a full kilometre from a tabletop mountain in Venezuela. What is it called?", "answer": "Angel Falls", "options": [], "explanation": ""}, {"id": "Q28", "lang": "en", "question": "Males of this species can pass six metres in length and are found from eastern India to northern Australia. What is the largest living reptile?", "answer": "Saltwater crocodile", "options": [], "explanation": ""}, {"id": "Q29", "lang": "en", "question": "Gouda, Edam, and Leyden are all famous cheeses that share the same country of origin. Which nation gave the world this trio?", "answer": "a", "options": ["The Netherlands", "Switzerland", "France", "Belgium"], "explanation": ""}, {"id": "Q30", "lang": "en", "question": "In Venice, the famous Bridge of Sighs connects the Doge's Palace with what kind of building?", "answer": "A prison", "options": [], "explanation": ""}];
const state = {};
let db = null;

function el(tag, attrs, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === "class") n.className = v; else if (k.startsWith("data-")) n.setAttribute(k, v); else n[k] = v;
  }
  for (const k of kids) n.append(k);
  return n;
}

function setStatus(text, bad) {
  const s = document.getElementById("status");
  s.textContent = text;
  s.classList.toggle("bad", !!bad);
}

function updateProgress() {
  const done = ITEMS.filter(it => state[it.id] && state[it.id].verdict).length;
  document.getElementById("progress").textContent = done + " / " + ITEMS.length;
  for (const it of ITEMS) {
    const card = document.getElementById("card-" + it.id);
    const r = state[it.id] || {};
    card.classList.toggle("done", !!r.verdict);
    card.querySelectorAll(".yn button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.v === r.verdict)));
    const ta = card.querySelector("textarea");
    if (document.activeElement !== ta) ta.value = r.note || "";
  }
}

async function save(id, patch) {
  state[id] = Object.assign({}, state[id], patch);
  updateProgress();
  if (!db) { setStatus("Úložisko nie je dostupné, hodnotenie sa neuloží. Otvor stránku prihlásený na claude.ai.", true); return; }
  try {
    await db.collection("ratings").doc(id).set(state[id]);
    setStatus("Uložené.");
  } catch (e) {
    setStatus("Uloženie zlyhalo: " + (e && e.message ? e.message : "neznáma chyba") + ". Skús ťuknúť znova.", true);
  }
}

function render() {
  const list = document.getElementById("list");
  for (const it of ITEMS) {
    const yn = el("div", { class: "yn" });
    for (const [v, label] of [["keep", "Nechať"], ["drop", "Otrepaná, vyhodiť"]]) {
      const b = el("button", { type: "button", "data-v": v }, label);
      b.addEventListener("click", () => save(it.id, { verdict: v }));
      yn.append(b);
    }
    const ta = el("textarea", { id: "note-" + it.id, placeholder: "Poznámka (nepovinné)" });
    let timer = null;
    ta.addEventListener("input", () => { clearTimeout(timer); timer = setTimeout(() => save(it.id, { note: ta.value }), 800); });

    const opts = it.options && it.options.length ? el("ol", { class: "opts", type: "a" }, ...it.options.map(o => el("li", {}, o))) : "";
    const reveal = el("details", {},
      el("summary", {}, "Ukáž odpoveď"),
      el("p", {}, el("span", { class: "ans" }, it.answer)),
      it.explanation ? el("p", {}, it.explanation) : "");
    list.append(el("article", { class: "q", id: "card-" + it.id },
      el("div", { class: "meta" }, el("span", {}, it.id), el("span", { class: "lang" }, it.lang)),
      el("p", { class: "stem" }, it.question),
      opts,
      reveal,
      el("div", { class: "row" }, el("span", { class: "lbl" }, "Nechať, alebo vyhodiť?"), yn),
      ta));
  }
  updateProgress();
}

render();
(async () => {
  try { db = window.claude ? await window.claude.use("db") : null; } catch (e) { db = null; }
  if (!db) { setStatus("Úložisko nie je dostupné, hodnotenie sa neuloží. Otvor stránku prihlásený na claude.ai.", true); return; }
  setStatus("Pripojené. Hodnotenie sa ukladá hneď.");
  db.collection("ratings").onSnapshot(snap => {
    for (const d of snap.docs) state[d.id] = Object.assign({}, d.data());
    updateProgress();
  }, () => setStatus("Spojenie s úložiskom sa prerušilo. Obnov stránku.", true));
})();
</script>
