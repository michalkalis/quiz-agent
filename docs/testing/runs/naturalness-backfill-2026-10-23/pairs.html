<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rethink+Sans:wght@400;500;700&display=swap">
<style>
/* Layout: one narrow column of question cards, sticky progress bar on top; tap-first controls for phone use. */
:root {
  --bg: #f3f4f1;
  --card: #ffffff;
  --fg: #1b1d1a;
  --muted: #646a62;
  --line: #dde0d9;
  --accent: #1f5f4a;
  --accent-ink: #ffffff;
  --accent-soft: #dcebe4;
  --no: #8a3b2a;
  --no-soft: #f3e1dc;
  --font: "Rethink Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121411; --card: #1b1e1a; --fg: #e7eae4; --muted: #9aa196; --line: #2c312a;
    --accent: #6fc3a2; --accent-ink: #0f1a15; --accent-soft: #1f3a30; --no: #e49a86; --no-soft: #3a2420;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121411; --card: #1b1e1a; --fg: #e7eae4; --muted: #9aa196; --line: #2c312a;
  --accent: #6fc3a2; --accent-ink: #0f1a15; --accent-soft: #1f3a30; --no: #e49a86; --no-soft: #3a2420;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 16px; line-height: 1.45; }
.wrap { max-width: 44rem; margin: 0 auto; padding-inline: 16px; padding-block: 0 4rem; }
header.bar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 2; background: var(--bg);
  padding-block: 0.75rem; border-bottom: 1px solid var(--line); display: flex; gap: 1rem; align-items: center; flex-wrap: wrap;
}
header.bar h1 { font-size: 1.15rem; margin: 0; font-weight: 700; flex: 1 1 auto; text-wrap: balance; }
.progress { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 0.9rem; }
.status { font-size: 0.85rem; color: var(--muted); width: 100%; }
.status.bad { color: var(--no); }
.intro { color: var(--muted); max-width: 62ch; margin-block: 1rem 1.5rem; }
.list { display: grid; gap: 1rem; }
.q { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 1rem; display: grid; gap: 0.75rem; min-width: 0; }
.q.done { border-color: var(--accent); }
.meta { display: flex; gap: 0.5rem; align-items: center; font-size: 0.8rem; color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }
.meta .lang { border: 1px solid var(--line); border-radius: 999px; padding: 0 0.5rem; }
.stem { font-size: 1.05rem; font-weight: 500; margin: 0; }
.opts { margin: 0; padding-left: 1.2rem; color: var(--fg); }
details summary { cursor: pointer; color: var(--accent); font-weight: 500; }
details p { margin: 0.4rem 0 0; }
.ans { font-weight: 700; }
.row { display: grid; gap: 0.4rem; }
.row label, .row .lbl { font-size: 0.85rem; color: var(--muted); }
.scale { display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 0.3rem; }
.scale button, .yn button {
  font: inherit; font-variant-numeric: tabular-nums; border: 1px solid var(--line); background: var(--bg); color: var(--fg);
  border-radius: 8px; padding-block: 0.55rem; cursor: pointer; min-width: 0;
}
.scale button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.yn { display: grid; grid-template-columns: 1fr 1fr; gap: 0.4rem; }
.yn button[data-v="yes"][aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--fg); }
.yn button[data-v="no"][aria-pressed="true"] { background: var(--no-soft); border-color: var(--no); color: var(--fg); }
button:focus-visible, textarea:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
textarea { font: inherit; width: 100%; min-height: 2.6rem; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--fg); padding: 0.5rem; resize: vertical; }
.ver { border: 1px solid var(--line); border-radius: 10px; padding: 0.75rem; display: grid; gap: 0.25rem; }
.ver .tag { font-size: 0.8rem; color: var(--muted); font-weight: 700; }
.ver p { margin: 0; font-size: 1.02rem; }
mark { background: var(--accent-soft); color: inherit; border-radius: 3px; padding: 0 1px; }
.pick { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0.4rem; }
.pick button { font: inherit; border: 1px solid var(--line); background: var(--bg); color: var(--fg); border-radius: 8px; padding-block: 0.55rem; cursor: pointer; min-width: 0; }
.pick button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
</style>

</div>

lse], ["prohlížejí,", true], [" ve skutečnosti vůbec není hmyz. Do které skupiny živočichů patří? Napoví vám počet jeho nohou.", false]]}, {"id": "P14", "lang": "cs", "answer": "Japonsko", "v1": [["Airsoft, se kterým dnes o víkendech běhají partičky po českých lesích,", true], [" vznikl v asijské zemi s tak přísnými zákony, že tam civilista skutečnou pistoli skoro nesežene. Která je to země?", false]], "v2": [["Airsoft", true], [" vznikl v asijské zemi s tak přísnými zákony, že tam civilista skutečnou pistoli skoro nesežene. Která je to země?", false]]}, {"id": "P15", "lang": "sk", "answer": "asi 30 000 km", "v1": [["Jeden blok v Minecrafte zodpovedá približne jednému metru. Ako ďaleko by ste museli kráčať zo stredu sveta až k jeho ", false], ["okraju?", true]], "v2": [["Jeden blok v Minecrafte zodpovedá približne jednému metru. Ako ďaleko by ste museli kráčať zo stredu sveta až k jeho ", false], ["okraju, teda k hranici sveta?", true]]}, {"id": "P16", "lang": "cs", "answer": "obložený chlebíček", "v1": [["Hotelovému bufetu říkáme švédský stůl. Švédsky se mu říká smörgåsbord, kde „bord“ znamená stůl. Co znamená „smörgås“? Nápověda: v Česku ", false], ["ho ", true], ["nesmí chybět na žádné oslavě.", false]], "v2": [["Hotelovému bufetu říkáme švédský stůl. Švédsky se mu říká smörgåsbord, kde „bord“ znamená stůl. Co znamená „smörgås“? Nápověda: v Česku ", false], ["nesmí chybět na žádné oslavě.", false]]}, {"id": "P17", "lang": "cs", "answer": "Ušní lalůčky", "v1": [["V obchodě kupujeme hlavně hnědá vejce, ale některá plemena slepic snášejí bílá. ", false], ["Kterou", true], [" část hlavy ", false], ["si podle chovatelů stačí na slepici prohlédnout, abyste", true], [" barvu jejích vajec ", false], ["většinou", true], [" ", false], ["odhadli?", true]], "v2": [["V obchodě kupujeme hlavně hnědá vejce, ale některá plemena slepic snášejí bílá. ", false], ["Podle chovatelů vám většinou stačí prohlédnout si slepici jednu", true], [" část hlavy ", false], ["a", true], [" barvu const state = {};
let db = null;

function el(tag, attrs, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === "class") n.className = v; else if (k.startsWith("data-")) n.setAttribute(k, v); else n[k] = v;
  }
  for (const k of kids) n.append(k);
  return n;
}

function setStatus(text, bad) {
  const s = document.getElementById("status");
  s.textContent = text;
  s.classList.toggle("bad", !!bad);
}

function updateProgress() {
  const done = ITEMS.filter(it => state[it.id] && state[it.id].pick).length;
  document.getElementById("progress").textContent = done + " / " + ITEMS.length;
  for (const it of ITEMS) {
    const card = document.getElementById("card-" + it.id);
    const r = state[it.id] || {};
    card.classList.toggle("done", !!r.pick);
    card.querySelectorAll(".pick button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.v === r.pick)));
    const ta = card.querySelector("textarea");
    if (document.activeElement !== ta) ta.value = r.note || "";
  }
}

async function save(id, patch) {
  state[id] = Object.assign({}, state[id], patch);
  updateProgress();
  if (!db) { setStatus("Úložisko nie je dostupné, voľba sa neuloží. Otvor stránku prihlásený na claude.ai.", true); return; }
  try {
    await db.collection("pairs").doc(id).set(state[id]);
    setStatus("Uložené.");
  } catch (e) {
    setStatus("Uloženie zlyhalo: " + (e && e.message ? e.message : "neznáma chyba") + ". Skús ťuknúť znova.", true);
  }
}

function version(tag, segs) {
  const p = el("p", {});
  for (const [text, changed] of segs) p.append(changed ? el("mark", {}, text) : document.createTextNode(text));
  return el("div", { class: "ver" }, el("span", { class: "tag" }, tag), p);
}

function render() {
  const list = document.getElementById("list");
  for (const it of ITEMS) {
    const pick = el("div", { class: "pick" });
    for (const [v, label] of [["1", "Lepšia 1"], ["same", "Rovnaké"], ["2", "Lepšia 2"]]) {
      const b = el("button", { type: "button", "data-v": v }, label);
      b.addEventListener("click", () => save(it.id, { pick: v }));
      pick.append(b);
    }
    const ta = el("textarea", { placeholder: "Poznámka (nepovinné)" });
    let timer = null;
    ta.addEventListener("input", () => { clearTimeout(timer); timer = setTimeout(() => save(it.id, { note: ta.value }), 800); });
    list.append(el("article", { class: "q", id: "card-" + it.id },
      el("div", { class: "meta" }, el("span", {}, it.id), el("span", { class: "lang" }, it.lang)),
      version("1", it.v1),
      version("2", it.v2),
      el("p", {}, "Odpoveď: ", el("span", { class: "ans" }, it.answer)),
      el("div", { class: "row" }, el("span", { class: "lbl" }, "Ktorá znie lepšie?"), pick),
      ta));
  }
  updateProgress();
}

render();
(async () => {
  try { db = window.claude ? await window.claude.use("db") : null; } catch (e) { db = null; }
  if (!db) { setStatus("Úložisko nie je dostupné, voľba sa neuloží. Otvor stránku prihlásený na claude.ai.", true); return; }
  setStatus("Pripojené. Voľba sa ukladá hneď.");
  db.collection("pairs").onSnapshot(snap => {
    for (const d of snap.docs) state[d.id] = Object.assign({}, d.data());
    updateProgress();
  }, () => setStatus("Spojenie s úložiskom sa prerušilo. Obnov stránku.", true));
})();
</script>
