# Fly.io configuration for Quiz Agent API — STAGING (backend only; #193 task
# 193.10). Pre-prod rehearsal of risky changes + migrations on a copy of prod
# data. Runbook: docs/setup/staging.md. Deploy from the repo root:
# fly deploy -c apps/quiz-agent/fly.staging.toml
app = "quiz-agent-api-staging"
primary_region = "cdg"

# Build from repository root to access monorepo packages
[build]
  dockerfile = "Dockerfile"
  build_context = "../.."

# Same as prod: migrate before rollout, so a migration is rehearsed here first.
[deploy]
  release_command = "alembic upgrade head"

[env]
  # RC_ALLOWED_ENVIRONMENT=SANDBOX is set as a Fly secret alongside
  # DATABASE_URL/REVENUECAT_* (issue #101 §3.5) — not duplicated here since
  # those are per-deploy secrets, not build-time config.
  ENVIRONMENT = "staging"
  # Keep the TTS audio cache on the mounted volume — see fly.toml for why the
  # default path would silently re-buy the cache on every deploy.
  TTS_CACHE_DIR = "/data/tts_cache"
  # Same for the SQLite stores — see fly.toml for why the defaults land on
  # container-local /app/data and are lost on every idle wake.
  TRANSLATION_CACHE_URL = "sqlite:////data/translations.db"
  RATINGS_DATABASE_URL = "sqlite:////data/ratings.db"

[[services]]
  protocol = "tcp"
  internal_port = 8002
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[services.ports]]
    port = 80
    handlers = ["http"]
    force_https = true

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  # Health check configuration
  # App takes ~8 seconds to start, so give it longer grace period
  [[services.http_checks]]
    grace_period = "30s"
    interval = "30s"
    timeout = "10s"
    method = "GET"
    path = "/api/v1/health"

[[mounts]]
  source = "quiz_agent_data_staging"
  destination = "/data"

# Prod runs 512MB (set via `fly scale`, not its toml); 256MB default fails the
# boot health check — pin it here so redeploys keep parity.
[[vm]]
  memory = "512mb"
